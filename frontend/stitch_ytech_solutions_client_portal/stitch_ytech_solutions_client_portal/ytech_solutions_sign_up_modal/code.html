<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Ytech Solutions - Sign Up</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container": "#eceef0",
                        "secondary-fixed": "#6ffbbe",
                        "inverse-primary": "#bcc7de",
                        "tertiary-fixed": "#d3e4fe",
                        "on-error-container": "#93000a",
                        "on-secondary-container": "#00714d",
                        "on-primary-fixed": "#111c2d",
                        "on-primary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "tertiary": "#041528",
                        "secondary-fixed-dim": "#4edea3",
                        "secondary-container": "#6cf8bb",
                        "surface-dim": "#d8dadc",
                        "on-background": "#191c1e",
                        "primary-fixed": "#d8e3fb",
                        "on-tertiary-fixed": "#0b1c30",
                        "on-primary-fixed-variant": "#3c475a",
                        "tertiary-container": "#1a2a3e",
                        "secondary": "#006c49",
                        "on-secondary-fixed": "#002113",
                        "tertiary-fixed-dim": "#b7c8e1",
                        "error": "#ba1a1a",
                        "surface-container-highest": "#e0e3e5",
                        "inverse-surface": "#2d3133",
                        "on-primary-container": "#8590a6",
                        "on-surface-variant": "#45474c",
                        "primary-fixed-dim": "#bcc7de",
                        "outline": "#75777d",
                        "on-tertiary": "#ffffff",
                        "surface-container-high": "#e6e8ea",
                        "on-error": "#ffffff",
                        "surface-container-low": "#f2f4f6",
                        "on-tertiary-fixed-variant": "#38485d",
                        "error-container": "#ffdad6",
                        "surface-variant": "#e0e3e5",
                        "outline-variant": "#c5c6cd",
                        "on-secondary": "#ffffff",
                        "surface-tint": "#545f73",
                        "on-surface": "#191c1e",
                        "primary": "#091426",
                        "on-secondary-fixed-variant": "#005236",
                        "inverse-on-surface": "#eff1f3",
                        "on-tertiary-container": "#8191a9",
                        "surface-bright": "#f7f9fb",
                        "surface": "#f7f9fb",
                        "background": "#f7f9fb",
                        "primary-container": "#1e293b",
                        "emerald": {
                            "500": "#10B981"
                        },
                        "slate": {
                            "200": "#E2E8F0",
                            "800": "#1E293B"
                        }
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-max": "1280px",
                        "stack-md": "32px",
                        "stack-lg": "64px",
                        "margin-x": "40px",
                        "gutter": "32px",
                        "stack-sm": "16px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "label-sm": ["Inter"],
                        "display-lg": ["Inter"],
                        "button": ["Inter"],
                        "body-lg": ["Inter"],
                        "display-lg-mobile": ["Inter"],
                        "headline-md": ["Inter"]
                    },
                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "1.5", "letterSpacing": "0", "fontWeight": "400" }],
                        "label-sm": ["14px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "button": ["15px", { "lineHeight": "1", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "letterSpacing": "0", "fontWeight": "400" }],
                        "display-lg-mobile": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .input-minimal {
            @apply w-full bg-surface-container-lowest border border-slate-200 rounded-lg px-4 py-3 text-on-surface font-body-md text-body-md transition-colors focus:outline-none focus:border-emerald-500 focus:ring-0;
        }
        .label-minimal {
            @apply block mb-2 font-label-sm text-label-sm text-on-surface-variant;
        }
    </style>
</head>
<body class="bg-background min-h-screen flex items-center justify-center font-body-md antialiased overflow-hidden">
<!-- Background Layer (Simulating a dashboard behind the modal) -->
<div class="absolute inset-0 z-0">
<div class="w-full h-full bg-surface-container-lowest opacity-50" style="background-image: radial-gradient(#cbd5e1 1px, transparent 1px); background-size: 32px 32px;"></div>
</div>
<!-- Modal Backdrop -->
<div aria-hidden="true" class="fixed inset-0 z-40 bg-primary/40 backdrop-blur-sm transition-opacity"></div>
<!-- Modal Container -->
<div class="relative z-50 w-full max-w-md mx-auto px-4 md:px-0">
<!-- Card -->
<div class="bg-surface-container-lowest rounded-2xl shadow-xl border border-slate-200 overflow-hidden transform transition-all">
<!-- Header -->
<div class="px-8 pt-8 pb-6 flex items-start justify-between">
<div>
<h2 class="font-headline-md text-headline-md text-primary mb-2">Create Your Account</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Get access to premium web packages and real-time project tracking</p>
</div>
<button aria-label="Close" class="text-on-surface-variant hover:text-primary transition-colors flex-shrink-0 ml-4 p-1 rounded-full hover:bg-surface-container-low" type="button">
<span aria-hidden="true" class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Body / Form -->
<div class="px-8 pb-8">
<form action="#" class="space-y-5" method="POST">
<div>
<label class="font-label-sm text-label-sm text-on-primary-fixed-variant uppercase tracking-wider mb-2 block" for="full_name">Full Name</label>
<div class="relative"><span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">person</span><input class="w-full bg-surface-container-lowest border border-slate-200 rounded-lg py-4 pl-12 pr-4 text-on-surface placeholder:text-on-surface-variant focus:border-emerald-500 focus:ring-0 focus:outline-none transition-colors font-body-md text-body-md" id="full_name" name="full_name" placeholder="John Doe" required="" type="text"></div>
</div>
<div>
<label class="font-label-sm text-label-sm text-on-primary-fixed-variant uppercase tracking-wider mb-2 block" for="corporate_email">Corporate Email</label>
<div class="relative"><span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">mail</span><input class="w-full bg-surface-container-lowest border border-slate-200 rounded-lg py-4 pl-12 pr-4 text-on-surface placeholder:text-on-surface-variant focus:border-emerald-500 focus:ring-0 focus:outline-none transition-colors font-body-md text-body-md" id="corporate_email" name="corporate_email" placeholder="name@company.com" required="" type="email"></div>
</div>
<div>
<label class="font-label-sm text-label-sm text-on-primary-fixed-variant uppercase tracking-wider mb-2 block" for="company_name">Company Name</label>
<div class="relative"><span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">business</span><input class="w-full bg-surface-container-lowest border border-slate-200 rounded-lg py-4 pl-12 pr-4 text-on-surface placeholder:text-on-surface-variant focus:border-emerald-500 focus:ring-0 focus:outline-none transition-colors font-body-md text-body-md" id="company_name" name="company_name" placeholder="Acme Corp" required="" type="text"></div>
</div>
<div>
<label class="font-label-sm text-label-sm text-on-primary-fixed-variant uppercase tracking-wider mb-2 block" for="password">Password</label>
<div class="relative"><span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">lock</span><input class="w-full bg-surface-container-lowest border border-slate-200 rounded-lg py-4 pl-12 pr-12 text-on-surface placeholder:text-on-surface-variant focus:border-emerald-500 focus:ring-0 focus:outline-none transition-colors font-body-md text-body-md" id="password" name="password" placeholder="••••••••" required="" type="password"><button aria-label="Toggle password visibility" class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors cursor-pointer" type="button"><span class="material-symbols-outlined">visibility_off</span></button></div>
</div>
<div class="pt-2">
<button class="w-full bg-emerald-500 text-on-primary font-button text-button py-4 px-6 rounded-lg hover:opacity-90 transition-opacity shadow-sm flex items-center justify-center gap-2 cursor-pointer" type="submit">Create Account <span class="material-symbols-outlined text-[18px]">arrow_forward</span></button>
</div>
</form>
</div>
<!-- Footer -->
<div class="px-8 py-6 bg-surface-container-low border-t border-slate-200 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Already have an account? 
                    <a class="font-label-sm text-label-sm text-emerald-500 hover:opacity-80 transition-opacity" href="#">Log in</a>
</p>
</div>
</div>
</div>


</body></html>
