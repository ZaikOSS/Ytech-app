<body class="bg-background min-h-screen text-on-surface font-body-md text-body-md overflow-hidden flex items-center justify-center">
<!-- Modal Backdrop -->
<div class="fixed inset-0 bg-primary-container/80 backdrop-blur-sm z-40 flex items-center justify-center p-4">
<!-- Modal Card -->
<div class="bg-surface-container-lowest w-full max-w-[480px] rounded-2xl border border-surface-variant shadow-lg relative overflow-hidden z-50 flex flex-col">
<!-- Header -->
<div class="p-stack-md pb-stack-sm flex items-start justify-between">
<div>
<h2 class="font-headline-md text-headline-md text-primary font-bold">Welcome Back</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-2">Sign in to manage your active development services</p>
</div>
<button aria-label="Close modal" class="text-on-surface-variant hover:text-on-surface transition-colors p-2 -mr-2 -mt-2 rounded-full hover:bg-surface-container-low cursor-pointer">
<span class="material-symbols-outlined text-[24px]">close</span>
</button>
</div>
<!-- Content Area (Form) -->
<div class="p-stack-md pt-0 flex-grow">
<form action="#" class="flex flex-col gap-stack-sm" method="POST">
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-primary-fixed-variant uppercase tracking-wider" for="email">Corporate Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg py-4 pl-12 pr-4 text-on-surface placeholder:text-outline focus:border-emerald-green focus:ring-0 focus:outline-none transition-colors font-body-md text-body-md" id="email" name="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<div class="flex flex-col gap-2 mt-4">
<div class="flex items-center justify-between">
<label class="font-label-sm text-label-sm text-on-primary-fixed-variant uppercase tracking-wider" for="password">Password</label>
<a class="font-label-sm text-label-sm text-emerald-green hover:opacity-80 transition-opacity" href="#">Forgot password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg py-4 pl-12 pr-12 text-on-surface placeholder:text-outline focus:border-emerald-green focus:ring-0 focus:outline-none transition-colors font-body-md text-body-md" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors cursor-pointer" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<!-- Form Actions -->
<div class="mt-stack-sm flex flex-col gap-stack-sm">
<button class="w-full bg-emerald-green text-surface-container-lowest font-button text-button py-4 px-6 rounded-lg hover:opacity-90 transition-opacity ambient-shadow flex items-center justify-center gap-2 cursor-pointer" type="submit">
                            Sign In
                            <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</form>
</div>
<!-- Footer Area -->
<div class="bg-surface-container-low p-6 border-t border-surface-variant flex items-center justify-center">
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-emerald-green transition-colors flex items-center gap-2 cursor-pointer" href="#">
                    New to Ytech Solutions? Create an account
                </a>
</div>
</div>
</div>
