<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Pay Invoice</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                    "error-container": "#ffdad6",
                    "surface-container-high": "#e6e8ea",
                    "on-error": "#ffffff",
                    "outline": "#75777d",
                    "primary-fixed-dim": "#bcc7de",
                    "surface-container-highest": "#e0e3e5",
                    "error": "#ba1a1a",
                    "tertiary-fixed-dim": "#b7c8e1",
                    "on-surface-variant": "#45474c",
                    "on-primary-container": "#8590a6",
                    "inverse-surface": "#2d3133",
                    "tertiary-container": "#1a2a3e",
                    "on-secondary-fixed": "#002113",
                    "secondary": "#006c49",
                    "primary-fixed": "#d8e3fb",
                    "on-background": "#191c1e",
                    "on-primary-fixed-variant": "#3c475a",
                    "on-tertiary-fixed": "#0b1c30",
                    "surface-dim": "#d8dadc",
                    "tertiary": "#041528",
                    "secondary-fixed-dim": "#4edea3",
                    "secondary-container": "#6cf8bb",
                    "surface-container-lowest": "#ffffff",
                    "on-secondary-container": "#00714d",
                    "on-primary-fixed": "#111c2d",
                    "tertiary-fixed": "#d3e4fe",
                    "on-error-container": "#93000a",
                    "surface-container": "#eceef0",
                    "secondary-fixed": "#6ffbbe",

            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "stack-md": "32px",
                    "container-max": "1280px",
                    "stack-lg": "64px",
                    "margin-x": "40px",
                    "gutter": "32px",
                    "stack-sm": "16px"
            },
            "fontFamily": {
                    "display-lg-mobile": [
                            "Inter"
                    ],
                    "headline-md": [

                    ],
                    "label-sm": [

<style>
        .hover-shadow-subtle {
            transition: box-shadow 0.3s ease, border-color 0.3s ease;
        }
        .hover-shadow-subtle:hover {
            box-shadow: 0 4px 20px rgba(30, 41, 59, 0.05);
        }
        
        /* Custom input focus states based on Design System */
        .ds-input:focus {
            border-color: #10B981 !important; /* Sharp Emerald Green focus */
            outline: none;
            box-shadow: 0 0 0 1px #10B981 !important;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background min-h-screen flex items-center justify-center p-4 antialiased">
<!-- Card Container -->
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl border border-surface-variant overflow-hidden hover-shadow-subtle relative z-10">
<!-- Header -->
<div class="bg-surface-container-low py-6 px-8 text-center border-b border-surface-variant">
<h1 class="font-headline-md text-headline-md text-primary-container m-0">Pay Invoice</h1>
</div>
<!-- Content Area -->
<div class="p-8 flex flex-col gap-8">
<!-- Accepted Cards Row -->
<div class="flex items-center gap-4 justify-start text-on-surface-variant">
<span class="font-label-sm text-label-sm uppercase tracking-wider text-outline">Accepted</span>
<div class="flex gap-2">
<!-- Placeholder icons for card logos to maintain minimalism -->
<span class="material-symbols-outlined text-outline text-2xl" style="font-variation-settings: 'FILL' 1;">credit_card</span>
<span class="material-symbols-outlined text-outline text-2xl">account_balance_wallet</span>
<span class="material-symbols-outlined text-outline text-2xl">payments</span>
</div>
</div>
<!-- Amount Sector -->
<div class="flex flex-col gap-2 border-b border-surface-variant pb-6">
<div class="flex justify-between items-center w-full">
<span class="font-body-md text-body-md text-on-surface-variant">Payment amount</span>
<button class="font-button text-button text-secondary hover:text-on-secondary-container transition-colors focus:outline-none" type="button">Edit</button>
</div>
<div class="font-display-lg-mobile text-display-lg-mobile text-primary-container tracking-tight">
                    $500.00
                </div>
</div>
<!-- Core Inputs Form -->
<form class="flex flex-col gap-6" onsubmit="event.preventDefault();">
<!-- Name Input -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="cardName">Name on card</label>
<input class="ds-input w-full px-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline transition-colors" id="cardName" name="cardName" placeholder="e.g. Jane Doe" required="" type="text"/>
</div>
<!-- Card Details String Input -->
<!-- Card Number -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="cardNumber">Card number</label>
<input class="ds-input w-full px-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline transition-colors" id="cardNumber" name="cardNumber" placeholder="PAN|MM|YYYY|CVV (Example: 1442216444355245|02|2031|795)" required="" type="text"/>
</div>
<!-- Expiry and CVV Row -->
<div class="grid grid-cols-2 gap-4">
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="cardExpiry">Expires</label>
<input class="ds-input w-full px-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline transition-colors" id="cardExpiry" name="cardExpiry" placeholder="MM / YY" required="" type="text"/>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant flex justify-between" for="cardCvv">
      Security code
      <span class="material-symbols-outlined text-outline text-sm" title="3 or 4 digit code on back of card">info</span>
</label>
<input class="ds-input w-full px-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline transition-colors" id="cardCvv" name="cardCvv" placeholder="CVV" required="" type="text"/>
</div>
</div>
<!-- ZIP Code -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant flex justify-between" for="zipCode">
    ZIP code
    <span class="material-symbols-outlined text-outline text-sm" title="Billing ZIP or postal code">info</span>
</label>
<input class="ds-input w-full px-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline transition-colors" id="zipCode" name="zipCode" placeholder="e.g. 90210" required="" type="text"/>
</div>
<!-- Action Button -->
<button class="mt-4 w-full bg-[#10B981] hover:bg-[#059669] text-white py-4 px-6 rounded-lg font-button text-button flex items-center justify-center gap-2 transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#10B981]" type="submit">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">lock</span>
                    Pay $500.00
                </button>
</form>
<div class="text-center mt-2">
<p class="font-label-sm text-label-sm text-outline font-normal flex items-center justify-center gap-1">
<span class="material-symbols-outlined text-xs">verified_user</span>
                    Secure encrypted transaction
                </p>
</div>
</div>
</div>
</body></html>
