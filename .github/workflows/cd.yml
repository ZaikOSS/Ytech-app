name: CD Pipeline

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    name: Deploy & DAST Scan
    runs-on: self-hosted
    
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: 📥 Checkout latest code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: false

      - name: 🔐 Inject Environment Secrets
        run: |
          echo "==> Creating secure .env file for the backend..."
          echo "PORT=${{ secrets.PORT }}" > backend/.env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> backend/.env
          echo "STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}" >> backend/.env
          echo "STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}" >> backend/.env
          echo "STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}" >> backend/.env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> backend/.env
          echo "DB_HOST=db" >> backend/.env

      - name: 🏗️ Rebuild Docker images
        run: docker compose build --pull

      - name: 🚀 Start updated containers
        run: docker compose up -d

      - name: 🕷️ OWASP ZAP Baseline Scan (DAST)
        uses: zaproxy/action-baseline@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: 'http://localhost:80'
          fail_action: false # Warning only for now
          cmd_options: '-x report_xml.xml'

      # --- DEFECTDOJO INGESTION ---
      - name: 📤 Push DAST to DefectDojo API
        env:
          DOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
          DOJO_TOKEN: ${{ secrets.DEFECTDOJO_API_KEY }}
        run: |
          if [ -z "$DOJO_URL" ] || [ -z "$DOJO_TOKEN" ]; then
            echo "⚠️ DefectDojo credentials missing. Skipping upload."
            exit 0
          fi
          if [ -f report_xml.xml ]; then
            curl -X POST "$DOJO_URL/api/v2/import-scan/" \
              -H "Authorization: Token $DOJO_TOKEN" \
              -F "auto_create_context=true" \
              -F "product_type_name=Research and Development" \
              -F "product_name=YTECH-App" -F "engagement_name=CD_Deployment" \
              -F "scan_type=ZAP Scan" \
              -F "file=@report_xml.xml" || true
          fi

      - name: 🧹 Clean up unused Docker resources
        if: always() 
        run: docker system prune -f
