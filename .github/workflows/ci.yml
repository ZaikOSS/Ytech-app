name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  build-and-test:
    name: Build, Test & Scan
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 📁 Create reports directory
      run: mkdir -p reports

    # --- 1. SECRET SCANNING ---
    - name: 🔐 Secret Scanning (TruffleHog)
      uses: trufflesecurity/trufflehog@main
      continue-on-error: true
      with:
        path: ./
        base: ""
        head: ${{ github.ref_name }}
        extra_args: --only-verified

    - name: ⚙️ Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # --- 2. SOFTWARE COMPOSITION ANALYSIS (SCA) ---
    - name: 📦 Install Dependencies & Run Tests
      run: |
        cd backend && npm ci && npm test
        cd ../client && npm ci && npm run build

    - name: 📦 OWASP Dependency-Check (SCA)
      uses: dependency-check/Dependency-Check_Action@main
      continue-on-error: true
      with:
        project: 'YTECH-App'
        path: '.'
        format: 'JSON'
        out: 'reports'

    # --- 3. SAST (Semgrep) ---
    - name: 🔍 Semgrep Analysis (SAST)
      uses: returntocorp/semgrep-action@v1
      continue-on-error: true
      with:
        generateSarif: "1"
    - name: Move Semgrep Report
      run: mv semgrep.sarif reports/semgrep.sarif || true

    # --- 4. CONTAINER SECURITY (Trivy) ---
    - name: 🏗️ Build Docker Images
      run: docker compose build

    - name: 🐳 Trivy Config Scan (Dockerfile)
      uses: aquasecurity/trivy-action@master
      continue-on-error: true
      with:
        scan-type: 'config'
        format: 'json'
        output: 'reports/trivy-config.json'

    # Notice: Replace 'ytechsolutions-backend' with your actual image name built by compose
    - name: 🐳 Trivy Image Scan (Backend)
      uses: aquasecurity/trivy-action@master
      continue-on-error: true
      with:
        scan-type: 'image'
        image-ref: 'ytechsolutions-backend:latest'
        format: 'json'
        output: 'reports/trivy-backend-image.json'

    - name: ⬆️ Upload Scan Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ci-security-reports
        path: reports/

  # --- 5. CODEQL (SAST) ---
  analyze-codeql:
    name: Analyze Code (CodeQL)
    runs-on: ubuntu-latest
    needs: build-and-test
    continue-on-error: true 
    strategy:
      matrix:
        language: [ 'javascript' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
        upload: false
        output: sarif-results

    - name: ⬆️ Upload CodeQL Artifact
      uses: actions/upload-artifact@v4
      with:
        name: codeql-report
        path: sarif-results

  # --- 6. DEFECTDOJO INGESTION ---
  upload-to-defectdojo:
    name: Ingest Reports to DefectDojo
    needs: [build-and-test, analyze-codeql]
    runs-on: self-hosted
    if: always()
    steps:
      - name: 📥 Download all reports
        uses: actions/download-artifact@v4
        with:
          path: all-reports

      - name: 📤 Push to DefectDojo API
        env:
          DOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
          DOJO_TOKEN: ${{ secrets.DEFECTDOJO_API_KEY }}
        run: |
          if [ -z "$DOJO_URL" ] || [ -z "$DOJO_TOKEN" ]; then
            echo "⚠️ DefectDojo credentials missing in GitHub Secrets. Skipping upload."
            exit 0
          fi
          
          # Example curl for Dependency-Check
          if [ -f all-reports/ci-security-reports/dependency-check-report.json ]; then
            curl -X POST "$DOJO_URL/api/v2/import-scan/" \
              -H "Authorization: Token $DOJO_TOKEN" \
              -F "product_name=YTECH-App" -F "engagement_name=CI_Pipeline" \
              -F "scan_type=Dependency Check Report" \
              -F "file=@all-reports/ci-security-reports/dependency-check-report.json"
          fi
          
          # Example curl for Semgrep
          if [ -f all-reports/ci-security-reports/semgrep.sarif ]; then
            curl -X POST "$DOJO_URL/api/v2/import-scan/" \
              -H "Authorization: Token $DOJO_TOKEN" \
              -F "product_name=YTECH-App" -F "engagement_name=CI_Pipeline" \
              -F "scan_type=SARIF" \
              -F "file=@all-reports/ci-security-reports/semgrep.sarif"
          fi

          # Example curl for Trivy
          if [ -f all-reports/ci-security-reports/trivy-backend-image.json ]; then
            curl -X POST "$DOJO_URL/api/v2/import-scan/" \
              -H "Authorization: Token $DOJO_TOKEN" \
              -F "product_name=YTECH-App" -F "engagement_name=CI_Pipeline" \
              -F "scan_type=Trivy Scan" \
              -F "file=@all-reports/ci-security-reports/trivy-backend-image.json"
          fi
